  short title: >-
    Objection to petition in
  description: |-
    This interview helps someone in Massachusetts file an objection to a petition in an eviction action.
  can_I_use_this_form: |
    Use this interview if you were part of a Massachusetts summary process (eviction) case and want to object to a petition filed in that same case.

    You may object to either:
      * a Petition to Seal Eviction Record, or
      * a Petition for Judgment or Agreement to be Deemed Satisfied.

    You must have been the plaintiff/landlord or the defendant/tenant named in the original case.
  before_you_start: |
    This interview will help you file an objection to a petition in an eviction action.

    Before you get started, please gather:

    1. The court department and division for your eviction case
    2. The docket number from your case paperwork
    3. The names of the plaintiff (landlord) and defendant (tenant/occupant)
    4. A copy of the petition you are objecting to so you can identify who filed it
    5. Contact information for yourself and the other party or their lawyer
    6. Any notes about how you plan to send notice (mailing address, email, or plans to hand deliver)

    When you are finished, you will need to:

    1. Sign and file the objection with the court where the case was heard
    2. Serve a copy of the objection on the other party or their attorney by mail, in person, or by email
