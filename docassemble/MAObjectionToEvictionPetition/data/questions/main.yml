---
id: Objection_to_petition_in_an_eviction_action
continue button field: objection_to_petition_in_an_evictio_intro
question: |
  Objection to petition in an eviction action
subquestion: |
  Use this interview to object to a petition that was filed in your Massachusetts summary process (eviction) case.

  You can object if you are the plaintiff/landlord or defendant/tenant named in the case and want to respond to:
  
  * a Petition to Seal Eviction Record, or
  
  * a Petition for Judgment or Agreement to be Deemed Satisfied.

  Before you start, please gather:
  
  1. The court department and division from your case (for example, "Housing Court – Western Division")
  
  2. Your docket number (found on your court paperwork)
  
  3. The names of the plaintiff and defendant as they appear on the case
  
  4. A copy of the petition you are objecting to and the name of the person who filed it
  
  5. Contact information for yourself and the other party or their attorney, including mailing and email addresses
  
  6. Details on how you will send notice (mail, in person, or email)

  When you finish the interview, you will need to:
  
  1. Download, sign, and file the objection with the same court
  
  2. Send a copy to the other party or their attorney using the notice method you select

  Most people take about 10 minutes to complete this interview.
---
id: user role
question: |
  Did you start this case, or are you responding to a case that someone else started?
fields:
  - no label: user_ask_role
    datatype: radio
    choices:
      - Starting a new case: plaintiff
      - Responding to a case: defendant
  - note: |
      Okay, you are the **Plaintiff** or Petitioner in this case. The other side is the **Defendant** or Respondent.
    show if:
      variable: user_ask_role
      is: "plaintiff"
  - note: |
      Okay, you are the **Defendant** or Respondent in this case. The other side is the **Plaintiff** or Petitioner.
    show if:
      variable: user_ask_role
      is: "defendant"
help:
  label: |
    How do I know?
  content: |
    If you are the first person to file a form in the case, you started the case. You are the "Plaintiff" or the "Petitioner."

    If you are responding to a case or court papers someone else filed, you are the "Defendant" or the "Respondent."
---
id: trial_court
question: |
  Which court is your case in?
subquestion: |
  Select the court that is listed on your eviction paperwork. If you are not sure, look at the top of your court form.
fields:
  - no label: trial_court
    datatype: object
    choices: all_courts
help:
  label: |
    How do I pick the court?
  content: |
    Choose the court that is on your existing eviction case paperwork. For this interview we limit you to courts in the Housing Court Department.
---
id: docket_number
question: |
  What is your case's docket number?
subquestion: |
  The docket number is on your court papers. It might look like 
  "24H84CV001234" or similar.
fields:
  - Docket number: docket_number
    required: True
    help: |
      Look for a number like "24H84CV001234" on your court papers.
      The "24" is the year, "H84" might be the court code, and the rest is your case number.
---
id: objection details
question: |
  Tell us about the petition you are objecting to
fields:
  - "Are you responding to a petition that someone else filed in your eviction case?": users1_is_defendant
    datatype: yesnoradio
    help: |
      Choose "Yes" if the other side filed the petition and you are objecting to it. Choose "No" if you filed the petition yourself.
  - note: |
      Check every petition you are objecting to.
  - "Petition to Seal Eviction Record": object_petition_seal_eviction
    datatype: yesno
  - "Petition for Judgment or Agreement to be Deemed Satisfied": object_petition_judgment_satisfied
    datatype: yesno
  - "Explain any additional reasons for your objection (optional)": objection_additional_information
    input type: area
    required: False
---
id: notice_recipients
question: |
  Who did you give notice to?
subquestion: |
  You must let the other side know that you objected to the petition. Tell the court who you sent notice to.
fields:
  - "I gave notice to the plaintiff": notice_given_to_plaintiff
    datatype: yesno
  - "I gave notice to the plaintiff's attorney": notice_given_to_plaintiff_attorney
    datatype: yesno
  - "I gave notice to the defendant": notice_given_to_defendant
    datatype: yesno
  - "Date you gave notice": notice_date
    datatype: date
    help: |
      Enter the date you sent or delivered the notice. This might be today or a date in the past.
---
id: notice_delivery_details
question: |
  How did you deliver the notice?
subquestion: |
  Select all methods you used to give notice. You can also provide the address or email you used.
fields:
  - "I sent the notice by mail": service_by_mail
    datatype: yesno
  - "I delivered the notice in person": service_in_person
    datatype: yesno
  - "Mailing address you used": notice_mailing_address
    required: False
  - "I sent the notice by email": service_by_email
    datatype: yesno
  - "Email address you used": notice_email_address
    datatype: email
    required: False

---
id: attorneys bbo number
question: |
  Attorney information (optional)
subquestion: |
  If an attorney represents you in this case, enter their Massachusetts Board of Bar Overseers (BBO) number.
fields:
  - "Attorney's BBO number": attorneys1_bbo_number
    required: False

---
id: preview objection_to_petition_in_an_evictio
question: |
  Preview your form before you sign it
subquestion: |
  Here is a preview of the form you will sign on the next page.   
  
  ${ al_court_bundle.as_pdf(key='preview') }

  Click the image to open it in a new tab. Click the "Edit answers" button
  to edit your answers.

  ${ action_button_html(url_action('review_objection_to_petition_in_an_evictio'), label='Edit answers', color='info') }
  
  Remember to come back to this window to continue and sign your form.
continue button field: objection_to_petition_in_an_evictio_preview_question    
