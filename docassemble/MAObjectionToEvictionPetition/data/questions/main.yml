id: objection to petition in an evictio review screen
event: review_objection_to_petition_in_an_evictio
question: |
  Review your answers
review:
  - Edit: docket_number
    button: |
      **Docket number**:
      ${ docket_number }
  - Edit: trial_court
    button: |
      **Trial court**
  
      % if defined("trial_court.department"):
      * department: ${ trial_court.department }
      % endif
      % if defined("trial_court.division"):
      * division: ${ trial_court.division }
      % endif
  - Edit: plaintiffs.revisit
    button: |
      **Plaintiffs**

      % for item in plaintiffs:
        * ${ item }
      % endfor
  - Edit: defendants.revisit
    button: |
      **Defendants**

      % for item in defendants:
        * ${ item }
      % endfor
  - Edit: users.revisit
    button: |
      **Users**

      % for item in users:
        * ${ item }
      % endfor
  - Edit: object_petition_seal_eviction
    button: |
      **Petition type**:

      * Objection to sealing eviction record: ${ word(yesno(object_petition_seal_eviction)) }
      * Objection to deeming judgment satisfied: ${ word(yesno(object_petition_judgment_satisfied)) }
  - Edit: objection_additional_information
    button: |
      **Additional explanation**:
      > ${ single_paragraph(objection_additional_information) }
  - Edit: notice_recipients
    button: |
      **Notice recipients**:

      * Notified the plaintiff: ${ word(yesno(notice_given_to_plaintiff)) }
      * Notified the plaintiff's attorney: ${ word(yesno(notice_given_to_plaintiff_attorney)) }
      * Notified the defendant: ${ word(yesno(notice_given_to_defendant)) }
      * Date you gave notice: ${ notice_date }
  - Edit: notice_delivery_details
    button: |
      **How you delivered notice**:

      * Served by mail: ${ word(yesno(service_by_mail)) }
      * Mailing address used: ${ notice_mailing_address }
      * Served in person: ${ word(yesno(service_in_person)) }
      * Served by email: ${ word(yesno(service_by_email)) }
      * Email address used: ${ notice_email_address }
  - Edit: signature_date
    button: |
      **Date of signature**:
      ${ signature_date }
  - Edit: attorneys1_bbo_number
    button: |
      **Attorneys1 bbo number**:
      ${ attorneys1_bbo_number }
---
continue button field: plaintiffs.revisit
question: |
  Edit plaintiffs
subquestion: |
  ${ plaintiffs.table }

  ${ plaintiffs.add_action() }
